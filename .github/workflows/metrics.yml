# Salve como: .github/workflows/metrics.yml
# no repositório joaopedro-stack/joaopedro-stack
name: Metrics

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06h (horário de Brasília)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: joaopedro-stack
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          config_display: large

          # Card de linguagens mais usadas
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
